apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: your-repo/order-service:latest
        envFrom:
        - configMapRef:
            name: order-service-config
        - secretRef:
            name: order-service-secret~